<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4d9ff"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Kouzelné omalovánky</title><style>*{box-sizing:border-box}body{margin:0;background:#f4d9ff;font: bold 18px system-ui;text-align:center;color:#65358a;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}h1{font-size:23px;margin:8px}button{border:0;border-radius:18px;background:white;padding:10px;font-size:25px;min-width:48px;min-height:48px;box-shadow:0 2px 4px #bba4cc;cursor:pointer}#gallery{display:flex;overflow:auto;gap:8px;padding:8px}#gallery button{flex:none}#gallery svg{width:65px;height:65px}#paper{background:white;border-radius:22px;max-width:560px;margin:auto;overflow:hidden;touch-action:none;position:relative}#paper svg{display:block;width:100%;height:min(49vh,560px)}#colors{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px auto;max-width:560px}#colors button{width:43px;height:43px;min-width:43px;min-height:43px;border:3px solid white;border-radius:50%;padding:0}#colors .selected{outline:3px solid #65358a}#tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px}#tools .selected{background:#c7a2ff}svg .part{stroke:#30303a;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;fill:white}svg .line{fill:none;stroke:#30303a;stroke-width:4;stroke-linecap:round;pointer-events:none}</style><h1>🌈 Kouzelné omalovánky</h1><div id="gallery"></div><div id="paper"></div><div id="colors"></div><div id="tools"><button id="fill" aria-label="Vybarvování">🪣</button><button id="pen" aria-label="Kreslení">🖍️</button><button id="erase" aria-label="Guma">🧽</button><button id="magic" aria-label="Náhodná barva">🌈</button><button id="undo" aria-label="Zpět">↶</button><button id="save" aria-label="Ulo const C=(x,y,r)=>`<circle class="part" cx="${x}" cy="${y}" r="${r}"/>`, E=(x,y,a,b)=>`<ellipse class="part" cx="${x}" cy="${y}" rx="${a}" ry="${b}"/>`, P=d=>`<path class="part" d="${d}"/>`, L=d=>`<path class="line" d="${d}"/>`, R=(x,y,w,h,r=8)=>`<rect class="part" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`, eyes=(y=175)=>C(170,y,7)+C(230,y,7)+L(`M185 ${y+30} Q200 ${y+45} 215 ${y+30}`), star=(x,y,r)=>P(Array.from({length:10},(_,i)=>{let a=i*Math.PI/5-Math.PI/2,k=i%2?r*.45:r;return `${i?'L':'M'}${x+Math.cos(a)*k} ${y+Math.sin(a)*k}`}).join(' ')+'Z');

const drawings=[['🐱',cat],['🐶',dog],['🐰',bunny],['🌸',flower],['🦋',butterfly],['🌈',rainbow],['👸',princess],['🦄',unicorn],['🐟',fish],['🏠',house],['🎂',cake],['🚗',car],['🐻',bear],['🐢',turtle],['🚀',rocket],['💗',heart],['🦉',owl],['⛄',snow],['🎈',balloon],['⛵',boat]];
const $=id=>document.getElementById(id), palette=['#ff3b30','#ff77b7','#ff9f0a','#ffdf35','#a8e63b','#34c759','#00c7be','#32ade6','#3478f6','#8655db','#d85bdb','#a56842','#222222','#aaaaaa','#ffffff'];let color=palette[0],mode='fill',magic=false,sound=false,index=0,history=[],drawing=false,path=null;const svgwrap=s=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">${s}</svg>`;function store(){try{localStorage.setItem('color-'+index,$('paper').firstChild.innerHTML)}catch(e){}}function snapshot(){history.push($('paper').firstChild.innerHTML);if(history.length>50)history.shift()}function load(i){index=i;history=[];let s=drawings[i][1]();try{s=localStorage.getItem('color-'+i)||s}catch(e){}$('paper').innerHTML=svgwrap(s)}drawings.forEach(([emoji,fn],i)=>{let b=document.createElement('button');b.innerHTML=svgwrap(fn())+'<br>'+emoji;b.onclick=()=>load(i);$('gallery').append(b)});palette.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label',c);b.onclick=()=>{color=c;magic=false;document.querySelectorAll('#colors button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');if(mode==='erase')setMode('fill')};$('colors').append(b)});$('colors').firstChild.classList.add('selected');function setMode(m){mode=m;['fill','pen','erase'].forEach(x=>$(x).classList.toggle('selected',x===m))}['fill','pen','erase'].forEach(m=>$(m).onclick=()=>setMode(m));setMode('fill');function pick(){return magic?palette[Math.floor(Math.random()*(palette.length-1))]:color}function beep(){if(!sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.06;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.stop(a.currentTime+.16);o.onended=()=>a.close()}catch(e){}}$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇'};$('magic').onclick=()=>{magic=true;setMode('fill')};function point(e){let s=$('paper').firstChild,p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse())} $('paper').onpointerdown=e=>{e.preventDefault();let s=$('paper').firstChild;if(mode==='fill'||mode==='erase'){if(e.target.classList.contains('part')){snapshot();e.target.style.fill=mode==='erase'?'white':pick();store();beep()}else if(mode==='erase'&&e.target.classList.contains('scribble')){snapshot();e.target.remove();store()}return}snapshot();drawing=true;$('paper').setPointerCapture(e.pointerId);let p=point(e);path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class','scribble');path.setAttribute('fill','none');path.setAttribute('stroke',pick());path.setAttribute('stroke-width','12');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');path.setAttribute('d',`M${p.x} ${p.y} l.1 .1`);s.append(path)};$('paper').onpointermove=e=>{if(drawing){let p=point(e);path.setAttribute('d',path.getAttribute('d')+` L${p.x} ${p.y}`)}};$('paper').onpointerup=$('paper').onpointercancel=()=>{drawing=false;store()};$('undo').onclick=()=>{if(history.length){$('paper').firstChild.innerHTML=history.pop();store()}};$('reset').onclick=()=>{if(confirm('Začít obrázek znovu?')){snapshot();$('paper').firstChild.innerHTML=drawings[index][1]();store()}};$('save').onclick=()=>{let s=$('paper').firstChild.cloneNode(true);s.setAttribute('width','800');s.setAttribute('height','800');let st=document.createElementNS('http://www.w3.org/2000/svg','style');st.textContent='.part{stroke:#30303a;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;fill:white}.line{fill:none;stroke:#30303a;stroke-width:4;stroke-linecap:round}';s.prepend(st);let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=c.height=800;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,800,800);ctx.drawImage(img,0,0);c.toBlob(async b=>{let f=new File([b],'omalovanka.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()},'image/png')};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(s))};load(0);if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
